
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
            - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --list_installed
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses
      # 4. Check project files
      - name: Check Project Structure
        run: |
          echo "Checking Android project..."
          ls -la
          test -d app || (echo "ERROR: app folder missing" && exit 1)
          test -f settings.gradle.kts -o -f settings.gradle || (echo "ERROR: settings file missing" && exit 1)

      # 5. Create .env.example if missing
      - name: Prepare Environment File
        run: |
          if [ ! -f .env.example ]; then
            cat > .env.example <<'EOF'
          # GEMINI_API_KEY placeholder
          # Configure your API key securely if required.
          # GEMINI_API_KEY=MY_GEMINI_API_KEY
          EOF
          fi

      # 6. Setup Gradle
      - name: Setup Gradle
        if: ${{ !hashFiles('gradlew') }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 7. Build APK
      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # 8. Verify APK
      - name: Verify APK
        run: |
          echo "Searching for APK..."
          find app/build/outputs/apk -type f -name "*.apk"
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)" || (echo "ERROR: APK not generated" && exit 1)

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Scanner-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
