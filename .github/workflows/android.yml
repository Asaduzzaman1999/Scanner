name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout source code
        uses: actions/checkout@v6

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install common Android SDK components
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Show SDK information
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed

      # 6. Create .env.example if project expects it
      - name: Prepare environment file
        shell: bash
        run: |
          if [ ! -f ".env.example" ]; then
            echo "Creating missing .env.example"
            touch .env.example
          else
            echo ".env.example already exists"
          fi

      # 7. Check project structure
      - name: Check project files
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== APP ====="
          if [ -d "app" ]; then
            ls -la app
          fi

          echo "===== GRADLE ====="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # 9. Build APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      # 10. Find APK
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scanner-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
